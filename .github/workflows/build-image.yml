name: build-image

# Construye la imagen de Evolution API con el parche de @lid para Chatwoot
# (upstream PR evolution-foundation/evolution-api#2718) y la publica en GHCR.
# Temporal: cuando el PR se mergee y salga release, volver a la imagen oficial.

on:
  workflow_dispatch:
  push:
    branches: [chatwoot-lid-fix]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/red-valley/evolution-api:2.3.7-pr2718
          cache-from: type=gha
          cache-to: type=gha,mode=max
